[project]
name = "jev"
version = "0.1.0"
description = "Typed decisions from any local language model, in one file."
readme = "README.md"
license = "MIT"
authors = [{ name = "Neeraj Bhatt" }, { name = "Gaurav Bhatt" }]
requires-python = ">=3.10"
keywords = ["llm", "log-probabilities", "classification", "structured-output", "benchmark", "jev"]
dependencies = ["torch>=2.4", "transformers>=4.45", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/neeraj1bh/jev.py"

[project.scripts]
jev = "jev.core:cli"
prod = "jev.page.server:cli"
dev = "jev.dev:main"
jev-bench = "jev.bench.core_v1:cli"
jev-eval = "jev.bench.eval:cli"
jev-readout = "jev.bench.readout:cli"
jev-remote = "jev.remote:cli"

[tool.uv.sources]
# CPU PyTorch on Linux and Windows: an AMD GPU is reached through llama.cpp, and the default wheel
# pulls gigabytes of CUDA libraries. macOS keeps the standard wheel, which uses the Apple GPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["mypy>=2.4.0", "pytest>=9.1.1"]

[tool.pytest]
testpaths = ["tests"]

[tool.mypy]
files = ["src/jev/core.py", "src/jev/remote.py"]
mypy_path = "src"
strict = true

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ×, — and ≥ in text and comments are meant

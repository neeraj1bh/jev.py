[project]
name = "jev"
version = "0.1.0"
description = "Typed decisions from any local language model, in one file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.45"]

[project.scripts]
jev = "jev.core:cli"
jev-demo = "jev.demo:cli"
jev-bench = "jev.bench:cli"
jev-eval = "jev.eval:cli"
jev-readout = "jev.readout:cli"
jev-remote = "jev.remote:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ×, — and ≥ in text and comments are meant

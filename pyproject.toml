[project]
name = "jev"
version = "0.1.0"
description = "Typed decisions from any local language model, in one file."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "transformers>=4.45", "httpx>=0.27"]

[project.scripts]
jev = "jev.core:cli"
prod = "jev.page.server:cli"
dev = "jev.dev:main"
jev-bench = "jev.bench:cli"
jev-eval = "jev.eval:cli"
jev-readout = "jev.readout:cli"
jev-remote = "jev.remote:cli"

[tool.uv.sources]
# CPU PyTorch on Linux and Windows: an AMD GPU is reached through llama.cpp, and the default wheel
# pulls gigabytes of CUDA libraries. macOS keeps the standard wheel, which uses the Apple GPU.
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # ×, — and ≥ in text and comments are meant
